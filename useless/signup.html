<!doctype html>
<html lang="en" dir="ltr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>SignUp - SkylineInventory Dashboard</title>

	<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">

	<!-- inject:css-->
	<link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<!-- endinject -->
	<link rel="icon" type="image/png" sizes="16x16" href="assets/img/fav.svg">
	<!-- Fonts -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css">

	<!-- Custom button color -->
	<style>
		.geex-content__authentication__form-submit {
			background-color: #ad071e !important;
			border-color: #ad071e !important;
			color: #fff !important;
			transition: background-color 0.3s ease;
		}

		.geex-content__authentication__form-submit:hover {
			background-color: #90061a !important;
			border-color: #90061a !important;
		}
	</style>

    <script>
		// Render localStorage JS:
		if (localStorage.theme) document.documentElement.setAttribute("data-theme", localStorage.theme);
		if (localStorage.layout) document.documentElement.setAttribute("data-nav", localStorage.navbar);
		if (localStorage.layout) document.documentElement.setAttribute("dir", localStorage.layout);
    </script>	
</head>

<body class="geex-dashboard authentication-page">
  <main class="geex-content">
    <div class="geex-content__authentication">
      <div class="geex-content__authentication__content">
        <div class="geex-content__authentication__content__wrapper">
          
          <!-- Logo -->
          <div class="geex-content__authentication__content__logo">
            <a href="index.html">
              <img class="logo-lite" src="assets/img/icon/skylinenewlogo.png" alt="logo">
              <img class="logo-dark" src="assets/img/icon/skylinenewlogo.png" alt="logo">
            </a>
          </div>

          <!-- OTP Login Form -->
          <form id="otpLoginForm" class="geex-content__authentication__form">
            <h2 class="geex-content__authentication__title"></h2>
            
            <!-- Email or Phone Input -->
            <div class="geex-content__authentication__form-group">
              <label for="contactInput">Email or Phone Number</label>
              <input type="text" id="contactInput" name="contactInput" placeholder="Enter your email or phone" required>
              <i class="uil-user"></i>
            </div>

            <!-- OTP Input -->
            <div class="geex-content__authentication__form-group">
              <label for="otpInput">Enter OTP</label>
              <input type="text" id="otpInput" name="otpInput" placeholder="Enter the 6-digit OTP" required>
              <i class="uil-key-skeleton"></i>
            </div>

           <!-- Submit -->
<button type="submit" class="geex-content__authentication__form-submit" onclick="window.location.href='home.html'; return false;">Login</button>
</form>
</div>
</div>


      <!-- Optional image -->
      <div class="geex-content__authentication__img">
        <img src="./assets/img/icon/signupimage.png" alt="Authentication Image">
      </div>
    </div>
  </main>

	<!-- inject:js-->
	<script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
	<script src="./assets/vendor/js/jquery/jquery-ui.js"></script>
	<script src="./assets/vendor/js/bootstrap/bootstrap.min.js"></script>
	<script src="./assets/js/main.js"></script>
	<!-- endinject-->
</body>
</html>

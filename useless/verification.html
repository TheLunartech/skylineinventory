<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Two Step Verification - Geex Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap"
      rel="stylesheet" />

    <!-- inject:css-->
    <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- endinject -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/img/favicon.svg" />
    <!-- Fonts -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css" />

    <script>
      // Render localStorage JS:
      if (localStorage.theme)
        document.documentElement.setAttribute("data-theme", localStorage.theme);
      if (localStorage.layout)
        document.documentElement.setAttribute("data-nav", localStorage.navbar);
      if (localStorage.layout)
        document.documentElement.setAttribute("dir", localStorage.layout);
    </script>
  </head>

  <body class="geex-dashboard authentication-page">
    <main class="geex-content">
      <div
        class="geex-content__authentication geex-content__authentication--forgot-password">
        <div class="geex-content__authentication__content">
          <div class="geex-content__authentication__content__wrapper">
            <div class="geex-content__authentication__content__logo">
              <a href="index.html">
                <img src="./assets/img/logo.svg" alt="" />
              </a>
            </div>
            <div
              id="verificationContent"
              class="geex-content__authentication__form">
              <h2 class="geex-content__authentication__title">
                Email Verification
              </h2>
              <div
                id="verificationMessage"
                class="geex-content__authentication__desc">
                <p>Verifying your email...</p>
              </div>
              <div
                id="verificationActions"
                style="display: none; margin-top: 20px">
                <a
                  href="signin.html"
                  class="geex-content__authentication__form-submit"
                  style="
                    display: inline-block;
                    text-align: center;
                    text-decoration: none;
                  "
                  >Go to Sign In</a
                >
              </div>
            </div>
          </div>
        </div>
        <div class="geex-content__authentication__img">
          <img src="./assets/img/authentication.svg" alt="" />
        </div>
      </div>
    </main>

    <!-- inject:js-->
    <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
    <script src="./assets/vendor/js/jquery/jquery-ui.js"></script>
    <script src="./assets/vendor/js/bootstrap/bootstrap.min.js"></script>
    <script src="./assets/js/main.js"></script>
    <!-- endinject-->

    <!-- Email Verification -->
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/auth-service.js"></script>
    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      const messageDiv = document.getElementById("verificationMessage");
      const actionsDiv = document.getElementById("verificationActions");

      if (!token) {
        messageDiv.innerHTML =
          '<p style="color: #dc3545;">❌ No verification token found. Please check your email for the verification link.</p>';
        actionsDiv.style.display = "block";
      } else {
        // Verify email
        authService
          .verifyEmail(token)
          .then((response) => {
            messageDiv.innerHTML =
              '<p style="color: #28a745;">✅ ' + response.message + "</p>";
            actionsDiv.style.display = "block";

            // Auto-redirect to signin after 3 seconds
            setTimeout(() => {
              window.location.href = "signin.html";
            }, 3000);
          })
          .catch((error) => {
            messageDiv.innerHTML =
              '<p style="color: #dc3545;">❌ ' + error.message + "</p>";
            actionsDiv.style.display = "block";
          });
      }
    </script>
  </body>
</html>

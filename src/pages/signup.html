<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>SignUp - Geex Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap"
      rel="stylesheet" />

    <!-- inject:css-->
    <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- endinject -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/img/favicon.svg" />
    <!-- Fonts -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css" />
    @@include('../layout/localStorageScript.html')
  </head>

  <body class="geex-dashboard authentication-page">
    <main class="geex-content">
      <div class="geex-content__authentication">
        <div class="geex-content__authentication__content">
          <div class="geex-content__authentication__content__wrapper">
            <div class="geex-content__authentication__content__logo">
              <a href="index.html">
                <img
                  class="logo-lite"
                  src="assets/img/logo-dark.svg"
                  alt="logo" />
                <img
                  class="logo-dark"
                  src="assets/img/logo-lite.svg"
                  alt="logo" />
              </a>
            </div>
            <div
              class="geex-content__authentication__form"
              style="text-align: center; padding: 40px">
              <h2 class="geex-content__authentication__title">
                Registration Disabled
              </h2>
              <p style="margin-top: 20px; color: #666">
                Self-registration is not available. Please contact your system
                administrator to create an account.
              </p>
              <div
                class="geex-content__authentication__form-footer"
                style="margin-top: 30px">
                Already have an account? <a href="signin.html">Sign In</a>
              </div>
            </div>
          </div>
        </div>
        <div class="geex-content__authentication__img">
          <img src="./assets/img/authentication.svg" alt="" />
        </div>
      </div>
    </main>

    <!-- inject:js-->
    <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
    <script src="./assets/vendor/js/jquery/jquery-ui.js"></script>
    <script src="./assets/vendor/js/bootstrap/bootstrap.min.js"></script>
    <script src="./assets/js/main.js"></script>
    <!-- endinject-->
  </body>
</html>
